<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 测试工具</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 30px;
      padding: 20px;
      background: #f5f7fa;
      border-radius: 12px;
    }

    .section h2 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }

    .result h3 {
      color: #333;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .result pre {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.5;
    }

    .success {
      border-left-color: #4caf50;
    }

    .error {
      border-left-color: #f44336;
    }

    .info {
      padding: 15px;
      background: #e3f2fd;
      border-radius: 8px;
      margin-bottom: 20px;
      color: #1976d2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 西昌农产品溯源 API 测试工具</h1>
    <p class="subtitle">快速测试登录注册接口</p>

    <div class="info">
      <strong>提示：</strong> 请确保后端服务运行在 http://localhost:8080
    </div>

    <!-- 注册测试 -->
    <div class="section">
      <h2>📝 注册测试</h2>
      <div class="form-group">
        <label>真实姓名</label>
        <input type="text" id="reg-name" value="测试用户" placeholder="请输入真实姓名">
      </div>
      <div class="form-group">
        <label>手机号</label>
        <input type="text" id="reg-phone" value="13800138000" placeholder="请输入手机号">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="reg-password" value="123456" placeholder="请输入密码">
      </div>
      <button onclick="testRegister()">测试注册</button>
      <div id="register-result"></div>
    </div>

    <!-- 登录测试 -->
    <div class="section">
      <h2>🔐 登录测试</h2>
      <div class="form-group">
        <label>手机号</label>
        <input type="text" id="login-phone" value="13800138000" placeholder="请输入手机号">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="login-password" value="123456" placeholder="请输入密码">
      </div>
      <button onclick="testLogin()">测试登录</button>
      <div id="login-result"></div>
    </div>

    <!-- 商品列表测试 -->
    <div class="section">
      <h2>📦 商品列表测试</h2>
      <p style="margin-bottom: 15px; color: #666;">需要先登录获取 Token</p>
      <button onclick="testProductList()">测试商品列表</button>
      <div id="product-result"></div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:8080/api';
    let token = '';

    // 测试注册
    async function testRegister() {
      const name = document.getElementById('reg-name').value;
      const phone = document.getElementById('reg-phone').value;
      const password = document.getElementById('reg-password').value;

      const resultDiv = document.getElementById('register-result');
      resultDiv.innerHTML = '<p>请求中...</p>';

      try {
        const response = await fetch(`${API_BASE_URL}/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            username: phone,
            password: password,
            realName: name,
            phone: phone,
            role: 'CUSTOMER'
          })
        });

        const data = await response.json();
        
        if (response.ok) {
          resultDiv.innerHTML = `
            <div class="result success">
              <h3>✅ 注册成功</h3>
              <pre>${JSON.stringify(data, null, 2)}</pre>
            </div>
          `;
        } else {
          resultDiv.innerHTML = `
            <div class="result error">
              <h3>❌ 注册失败</h3>
              <pre>${JSON.stringify(data, null, 2)}</pre>
            </div>
          `;
        }
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="result error">
            <h3>❌ 请求失败</h3>
            <pre>${error.message}</pre>
            <p style="margin-top: 10px;">请检查后端服务是否启动</p>
          </div>
        `;
      }
    }

    // 测试登录
    async function testLogin() {
      const phone = document.getElementById('login-phone').value;
      const password = document.getElementById('login-password').value;

      const resultDiv = document.getElementById('login-result');
      resultDiv.innerHTML = '<p>请求中...</p>';

      try {
        const response = await fetch(`${API_BASE_URL}/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            username: phone,
            password: password
          })
        });

        const data = await response.json();
        
        if (response.ok) {
          // 保存 token
          if (data.token) {
            token = data.token;
          } else if (data.data && data.data.token) {
            token = data.data.token;
          }

          resultDiv.innerHTML = `
            <div class="result success">
              <h3>✅ 登录成功</h3>
              <pre>${JSON.stringify(data, null, 2)}</pre>
              ${token ? `<p style="margin-top: 10px; color: #4caf50;">Token 已保存，可以测试商品列表</p>` : ''}
            </div>
          `;
        } else {
          resultDiv.innerHTML = `
            <div class="result error">
              <h3>❌ 登录失败</h3>
              <pre>${JSON.stringify(data, null, 2)}</pre>
            </div>
          `;
        }
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="result error">
            <h3>❌ 请求失败</h3>
            <pre>${error.message}</pre>
            <p style="margin-top: 10px;">请检查后端服务是否启动</p>
          </div>
        `;
      }
    }

    // 测试商品列表
    async function testProductList() {
      const resultDiv = document.getElementById('product-result');

      if (!token) {
        resultDiv.innerHTML = `
          <div class="result error">
            <h3>⚠️ 请先登录</h3>
            <p>需要先测试登录获取 Token</p>
          </div>
        `;
        return;
      }

      resultDiv.innerHTML = '<p>请求中...</p>';

      try {
        const response = await fetch(`${API_BASE_URL}/product/list`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            page: 1,
            pageSize: 10
          })
        });

        const data = await response.json();
        
        if (response.ok) {
          resultDiv.innerHTML = `
            <div class="result success">
              <h3>✅ 获取成功</h3>
              <pre>${JSON.stringify(data, null, 2)}</pre>
            </div>
          `;
        } else {
          resultDiv.innerHTML = `
            <div class="result error">
              <h3>❌ 获取失败</h3>
              <pre>${JSON.stringify(data, null, 2)}</pre>
            </div>
          `;
        }
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="result error">
            <h3>❌ 请求失败</h3>
            <pre>${error.message}</pre>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
